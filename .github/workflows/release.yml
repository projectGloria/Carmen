name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify installer without publishing a GitHub Release'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect version change
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          GLORIA_VER=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' gloria.toml | head -n 1)
          if [ "$CURRENT" != "$GLORIA_VER" ]; then
            echo "Version mismatch: package.json ($CURRENT) != gloria.toml ($GLORIA_VER)" >&2
            exit 1
          fi

          BUILD=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD=true
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BUILD=true
            else
              PREV=$(git show "${BEFORE}:package.json" 2>/dev/null | node -e "const fs=require('fs'); try { console.log(JSON.parse(fs.readFileSync(0,'utf8')).version || ''); } catch { console.log(''); }")
              if [ "$CURRENT" != "$PREV" ]; then
                BUILD=true
              fi
            fi
          fi

          PRERELEASE=false
          if [[ "$CURRENT" == *-* ]]; then
            PRERELEASE=true
          fi

          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$CURRENT build=$BUILD prerelease=$PRERELEASE"

  build:
    name: Build Windows installer (GloriaSetup)
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Run linter and unit tests
        shell: pwsh
        run: |
          npm run lint
          npm test

      - name: Build and stage unpacked Electron app
        shell: pwsh
        run: npm run pack

      - name: Pack installer with GloriaSetup
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          npx --yes gloria-setup@0.2.4 --app release/win-unpacked --manifest gloria.toml --version $version --out dist

      - name: Dry-run verify installer
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $setup = "dist\Carmen_${version}_x64-setup.exe"
          if (-not (Test-Path $setup)) {
            throw "Expected installer not found: $setup"
          }
          $proc = Start-Process -FilePath $setup -ArgumentList '/S --dry-run' -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Installer dry-run failed with exit code $($proc.ExitCode)"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: carmen-installer
          path: dist/Carmen_${{ needs.version.outputs.version }}_x64-setup.exe
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: carmen-installer
          path: release-assets

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum "Carmen_${{ needs.version.outputs.version }}_x64-setup.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create draft release, verify uploads, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          INSTALLER="Carmen_${VERSION}_x64-setup.exe"

          ARGS=(--draft --target "$TARGET_SHA" --title "Carmen ${TAG}" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi

          gh release create "$TAG" "release-assets/${INSTALLER}" "release-assets/SHA256SUMS.txt" "${ARGS[@]}"

          VERIFY_DIR=$(mktemp -d)
          gh release download "$TAG" --dir "$VERIFY_DIR" --pattern "$INSTALLER" --pattern "SHA256SUMS.txt"
          (cd "$VERIFY_DIR" && sha256sum --check SHA256SUMS.txt)

          gh release edit "$TAG" --draft=false
