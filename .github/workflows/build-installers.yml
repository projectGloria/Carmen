name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Installer (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron and electron-builder binaries
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: |
          npm run icons
          npm run build:ui
          npx electron-builder --win nsis --x64 --publish never

      - name: Collect installers
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = $pkg.version
          }
          $setupExe = Get-ChildItem -Path release -Filter '*-Setup.exe' | Select-Object -First 1
          if (-not $setupExe) {
            throw 'Expected NSIS installer (*-Setup.exe) not found in release/'
          }
          New-Item -ItemType Directory -Force -Path installers | Out-Null
          Copy-Item -Path $setupExe.FullName -Destination "installers/Carmen-$version-win-x64.exe"
          Get-ChildItem -Path installers

      - name: Upload installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: installers/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers artifact
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
